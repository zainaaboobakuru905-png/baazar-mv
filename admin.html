<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BazaarMV · Admin</title>
<style>
:root{--teal:#087e78;--ink:#142b35;--muted:#71838a;--line:#e8eeeb}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font:15px Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:25px 18px}.brand{font-size:23px;font-weight:800;color:var(--ink);text-decoration:none}.brand span{color:var(--teal)}h1{font-size:30px;margin:28px 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.notice,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}.notice{background:#fff4dc;border-color:#ead8a8}.notice.good{background:#eaf6ef;border-color:#c9e6d2}.notice.bad{background:#fff0ef;border-color:#f0ceca}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}.primary{background:var(--teal);color:white}.danger{background:#fff0ef;color:#873b34;border:1px solid #f0ceca}.plain{background:white;border:1px solid var(--line);color:var(--ink)}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px}.hidden{display:none!important}.pill{font-size:12px;font-weight:bold;padding:5px 8px;border-radius:20px;background:#fff4dc;color:#72551c}.pill.approved{background:#eaf6ef;color:#245c42}.pill.rejected{background:#fff0ef;color:#873b34}@media(max-width:600px){.row{display:block}.actions{margin-top:12px}}
</style></head><body><main class="wrap">
<a class="brand" href="index.html">Bazaar<span>MV</span></a><h1>Seller applications</h1><p class="muted">Private administrator area. Review seller applications from other accounts. You do not need to apply as a seller to manage BazaarMV.</p>
<div id="notice" class="notice">Checking administrator access…</div><section id="applications" class="hidden"></section>
<p class="muted"><a href="index.html">← Back to marketplace</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const el=id=>document.getElementById(id);let client=null,currentAdminId=null;
function msg(t,k=""){el("notice").textContent=t;el("notice").className="notice"+(k?" "+k:"");}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){msg("Loading applications…");const {data,error}=await client.rpc("bazaar_admin_list_seller_applications");if(error){msg(error.message,"bad");return;}const list=(data||[]).filter(a=>a.user_id!==currentAdminId);el("applications").classList.remove("hidden");if(!list.length){el("applications").innerHTML='<div class="card">No other seller applications yet.</div>';msg("Administrator access confirmed.","good");return;}el("applications").innerHTML=list.map(a=>'<article class="card"><div class="row"><div><h2>'+esc(a.shop_name)+'</h2><p class="muted">'+esc(a.island)+' · Submitted '+new Date(a.created_at).toLocaleString()+'</p><p>'+esc(a.description||"No shop description provided.")+'</p><p class="muted">Application ID: '+esc(a.user_id)+'</p></div><div><span class="pill '+esc(a.approval_status)+'">'+esc(a.approval_status)+'</span>'+(a.approval_status==="pending"?'<div class="actions"><button class="btn primary" data-review="approved" data-user="'+esc(a.user_id)+'">Approve</button><button class="btn danger" data-review="rejected" data-user="'+esc(a.user_id)+'">Reject</button></div>':'')+'</div></div></article>').join("");msg("Administrator access confirmed.","good");}
el("applications").addEventListener("click",async e=>{const b=e.target.closest("button[data-review]");if(!b)return;const decision=b.dataset.review;if(!confirm("Are you sure you want to "+decision+" this seller application?"))return;b.disabled=true;const {error}=await client.rpc("bazaar_admin_review_seller",{p_user_id:b.dataset.user,p_status:decision});if(error){await load();msg("Approval failed: "+error.message,"bad");b.disabled=false;return;}await load();msg("Approval request completed. Check the application status above.","good");});
async function start(){if(!window.supabase||!window.BAZAARMV_SUPABASE?.url||!window.BAZAARMV_SUPABASE?.publishableKey){msg("Supabase configuration is missing.","bad");return;}client=window.supabase.createClient(window.BAZAARMV_SUPABASE.url,window.BAZAARMV_SUPABASE.publishableKey);const {data,error}=await client.auth.getUser();if(error||!data.user){msg("Please sign in with the separate administrator account first.","bad");return;}currentAdminId=data.user.id;await load();}
start();
</script></body></html>
