<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages · BazaarMV</title>
<style>
:root{--teal:#087e78;--ink:#142b35;--muted:#71838a;--line:#e8eeeb}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font:15px Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:23px;font-weight:800;color:var(--ink);text-decoration:none}.brand span{color:var(--teal)}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none}.primary{background:var(--teal);color:white;border:0}h1{margin:25px 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.notice,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.layout{display:grid;grid-template-columns:300px 1fr;gap:14px}.threads{display:grid;gap:8px}.thread{width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;cursor:pointer}.thread.active{border-color:var(--teal);background:#eff8f5}.thread b{display:block}.chat{height:440px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:8px 2px}.bubble{max-width:82%;padding:10px 12px;border-radius:13px;background:#eef3f1;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{background:#dff2eb;align-self:flex-end}.bubble small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:130px;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}.chat{height:360px}}
</style></head><body><main class="wrap">
<div class="top"><a class="brand" href="index.html">Bazaar<span>MV</span></a><div><a class="btn" href="my-orders.html">My orders</a> <a class="btn" href="seller.html">Seller dashboard</a></div></div>
<h1>Messages</h1><p class="muted">Chat with buyers or approved sellers about marketplace products. Keep payment details and passwords out of messages.</p>
<div id="notice" class="notice">Connecting…</div>
<div class="layout"><section class="panel"><h2 style="font-size:17px;margin:0 0 10px">Conversations</h2><div id="threads" class="threads"><p class="muted">Loading…</p></div></section>
<section class="panel"><div id="chatTitle"><b>Select a conversation</b></div><div id="chat" class="chat"><div class="empty">Choose a conversation to read messages.</div></div><form id="compose" class="compose"><textarea id="body" maxlength="2000" placeholder="Write a message…" required></textarea><button class="btn primary" type="submit">Send</button></form></section></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db,user,threads=[],active=null;
function note(t){$("notice").textContent=t}
function key(m){return [m.buyer_id,m.seller_id,m.product_id||""].join("|")}
async function init(){
 if(!window.supabase||!window.BAZAARMV_SUPABASE?.url||!window.BAZAARMV_SUPABASE?.publishableKey){note("Database connection is not configured.");return}
 db=window.supabase.createClient(window.BAZAARMV_SUPABASE.url,window.BAZAARMV_SUPABASE.publishableKey);
 const {data:{user:u},error}=await db.auth.getUser();user=u;if(error||!user){note("Please sign in to use messages.");return}
 const params=new URLSearchParams(location.search),seller=params.get("seller"),product=params.get("product");
 if(seller&&product){
  if(seller===user.id){note("You cannot start a chat with your own seller account.");return}
  const {data:store,error:storeError}=await db.from("bazaar_public_seller_stores").select("user_id,shop_name").eq("user_id",seller).maybeSingle();
  if(storeError||!store){note("This seller shop is not available for messaging.");return}
  const {data:p,error:productError}=await db.from("products").select("id,name,seller_id").eq("id",product).eq("seller_id",seller).eq("is_active",true).maybeSingle();
  if(productError||!p){note("This product is no longer available.");return}
  active={buyer_id:user.id,seller_id:seller,product_id:product,product_name:p.name,other_name:store.shop_name};
  await loadMessages();
 }else{await loadThreads()}
 note("Messages are private to the buyer and seller.");
}
async function loadThreads(){
 const {data,error}=await db.from("bazaar_messages").select("id,buyer_id,seller_id,product_id,sender_id,body,created_at,read_at").or("buyer_id.eq."+user.id+",seller_id.eq."+user.id).order("created_at",{ascending:false}).limit(300);
 if(error){$("threads").innerHTML='<p class="muted">Could not load conversations: '+esc(error.message)+'</p>';return}
 const grouped=new Map();(data||[]).forEach(m=>{const k=key(m);if(!grouped.has(k))grouped.set(k,m)});
 threads=[...grouped.values()];
 const storeIds=[...new Set(threads.filter(t=>t.buyer_id===user.id).map(t=>t.seller_id))];
 let stores={};if(storeIds.length){const {data:s}=await db.from("bazaar_public_seller_stores").select("user_id,shop_name").in("user_id",storeIds);stores=Object.fromEntries((s||[]).map(x=>[x.user_id,x.shop_name]))}
 $("threads").innerHTML=threads.length?threads.map((t,i)=>'<button class="thread" data-thread="'+i+'"><b>'+esc(t.buyer_id===user.id?(stores[t.seller_id]||"Seller"):"Buyer")+'</b><span class="muted">'+esc(t.product_id?"Product conversation":"Conversation")+' · '+esc(t.body.slice(0,70))+'</span></button>').join(""):'<div class="empty">No conversations yet. Start a chat from a live product listing.</div>';
}
$("threads").addEventListener("click",async e=>{const b=e.target.closest("[data-thread]");if(!b)return;const t=threads[Number(b.dataset.thread)];active={buyer_id:t.buyer_id,seller_id:t.seller_id,product_id:t.product_id,product_name:"Product conversation",other_name:t.buyer_id===user.id?"Seller":"Buyer"};document.querySelectorAll(".thread").forEach(x=>x.classList.toggle("active",x===b));await loadMessages()});
async function loadMessages(){
 if(!active)return;
 let q=db.from("bazaar_messages").select("id,buyer_id,seller_id,product_id,sender_id,body,created_at,read_at").eq("buyer_id",active.buyer_id).eq("seller_id",active.seller_id);
 q=active.product_id?q.eq("product_id",active.product_id):q.is("product_id",null);
 const {data,error}=await q.order("created_at",{ascending:true}).limit(200);
 if(error){$("chat").innerHTML='<div class="empty">Could not load messages: '+esc(error.message)+'</div>';return}
 $("chatTitle").innerHTML='<b>'+esc(active.other_name||"Conversation")+'</b><div class="muted">'+esc(active.product_name||"Product chat")+'</div>';
 $("chat").innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.sender_id===user.id?"mine":"")+'">'+esc(m.body)+'<small>'+new Date(m.created_at).toLocaleString()+'</small></div>').join("")||'<div class="empty">Start the conversation with a friendly message.</div>';
 $("chat").scrollTop=$("chat").scrollHeight;
 const unread=(data||[]).filter(m=>m.sender_id!==user.id&&!m.read_at).map(m=>m.id);
 if(unread.length)await db.from("bazaar_messages").update({read_at:new Date().toISOString()}).in("id",unread);
}
$("compose").addEventListener("submit",async e=>{
 e.preventDefault();if(!active)return;
 const body=$("body").value.trim();if(!body)return;
 const btn=e.submitter;btn.disabled=true;
 const payload={...active,sender_id:user.id,body};delete payload.product_name;delete payload.other_name;
 const {error}=await db.from("bazaar_messages").insert(payload);
 if(error){note("Message could not be sent: "+error.message);btn.disabled=false;return}
 $("body").value="";await loadMessages();if(!new URLSearchParams(location.search).has("seller"))await loadThreads();btn.disabled=false;
});
init();
</script></body></html>
