<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My orders · BazaarMV</title>
<style>
:root{--teal:#087e78;--ink:#142b35;--muted:#71838a;--line:#e8eeeb}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font:15px Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:25px 18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:23px;font-weight:800;color:var(--ink);text-decoration:none}.brand span{color:var(--teal)}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:700}h1{margin:30px 0 8px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.notice,.order{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin:15px 0}.order h2{font-size:16px;margin:0 0 7px}.row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.items{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.status{color:var(--teal);font-weight:700}.notification-list{display:grid;gap:8px}.notification-item{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.notification-item.unread{border-left:4px solid var(--teal)}.notification-item p{margin:5px 0}.review-box{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfb}.review-box label{display:block;font-size:12px;font-weight:bold;margin:8px 0 4px}.review-box select,.review-box textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}.review-box textarea{min-height:65px;resize:vertical}.review-stars{color:#a66b00;font-weight:bold}
</style></head><body><main class="wrap">
<div class="top"><a class="brand" href="index.html">Bazaar<span>MV</span></a><div><a class="btn" href="messages.html">Messages</a> <a class="btn" href="index.html">← Marketplace</a></div></div>
<h1>My orders</h1><p class="muted">Track your orders and pay each shop directly using its own BML QR code or instructions.</p>
<div id="notice" class="notice">Checking your account…</div><section class="order"><div class="row"><h2>Notifications <span id="notificationCount" class="muted"></span></h2><button class="btn" id="refreshNotifications" type="button">Refresh</button></div><div id="notificationRows" class="notification-list"><p class="muted">Loading notifications…</p></div></section><h2 style="margin-top:28px">My enquiries</h2><p class="muted">Questions you have sent to sellers and their replies.</p><div id="enquiries"></div><div id="orders"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const notice=document.getElementById("notice"),out=document.getElementById("orders");let db=null,user=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function loadNotifications(){
 const host=document.getElementById("notificationRows");
 const {data,error}=await db.from("bazaar_notifications").select("id,title,message,created_at,read_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(30);
 if(error){host.innerHTML='<p class="muted">Notifications could not be loaded: '+esc(error.message)+'</p>';return;}
 const list=data||[],unread=list.filter(n=>!n.read_at).length;
 document.getElementById("notificationCount").textContent=unread?unread+" unread":"· All caught up";
 host.innerHTML=list.length?list.map(n=>'<article class="notification-item '+(!n.read_at?"unread":"")+'"><b>'+esc(n.title)+'</b><p>'+esc(n.message)+'</p><span class="muted">'+new Date(n.created_at).toLocaleString()+'</span>'+(!n.read_at?' <button class="btn" type="button" data-notification-read="'+esc(n.id)+'">Mark as read</button>':' <span class="muted">· Read</span>')+'</article>').join(""):'<p class="muted">No notifications yet. Order and payment updates will appear here.</p>';
}
document.getElementById("refreshNotifications").addEventListener("click",loadNotifications);
function showLiveNotification(n){
 let toast=document.getElementById("liveNotificationToast");
 if(!toast){toast=document.createElement("div");toast.id="liveNotificationToast";toast.style.cssText="position:fixed;right:18px;bottom:18px;z-index:9999;max-width:340px;padding:14px 16px;background:#142b35;color:#fff;border-radius:12px;box-shadow:0 8px 28px #0003;font:14px Arial,sans-serif";document.body.appendChild(toast);}
 toast.textContent=(n.title||"New notification")+(n.message?" — "+n.message:"");
 toast.hidden=false;
 if(window.bazaarToastTimer)clearTimeout(window.bazaarToastTimer);
 window.bazaarToastTimer=setTimeout(()=>{toast.hidden=true;},6500);
}
function subscribeToNotifications(){
 if(!client||!user||window.bazaarNotificationChannel)return;
 window.bazaarNotificationChannel=client.channel("bazaar-notifications-"+user.id)
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"bazaar_notifications",filter:"user_id=eq."+user.id},payload=>{
   showLiveNotification(payload.new||{});
   loadNotifications();
  }).subscribe();
}
document.getElementById("notificationRows").addEventListener("click",async e=>{const b=e.target.closest("[data-notification-read]");if(!b)return;b.disabled=true;const {error}=await db.from("bazaar_notifications").update({read_at:new Date().toISOString()}).eq("id",b.dataset.notificationRead).eq("user_id",user.id);if(error){b.disabled=false;alert("Could not update notification: "+error.message);return;}await loadNotifications();});
async function renderOrderReviews(order){
 const {data:reviews,error}=await db.from("product_reviews").select("product_id,rating,review_text,created_at").eq("order_id",order.id);
 if(error)return '<p class="muted">Reviews could not be loaded: '+esc(error.message)+'</p>';
 return (order.order_items||[]).map(item=>{
  const existing=(reviews||[]).find(r=>r.product_id===item.product_id);
  if(existing)return '<div style="padding:9px 0;border-top:1px solid var(--line)"><b>'+esc(item.product_name)+'</b><div class="review-stars">'+'★'.repeat(existing.rating)+'☆'.repeat(5-existing.rating)+'</div><p style="white-space:pre-wrap;margin:5px 0">'+esc(existing.review_text||"No written comment.")+'</p><span class="muted">Review submitted</span></div>';
  return '<form class="review-form" data-order="'+esc(order.id)+'" data-product="'+esc(item.product_id)+'" style="padding:9px 0;border-top:1px solid var(--line)"><b>'+esc(item.product_name)+'</b><label>Star rating</label><select name="rating" required><option value="">Choose a rating</option><option value="5">★★★★★ · Excellent</option><option value="4">★★★★☆ · Good</option><option value="3">★★★☆☆ · Okay</option><option value="2">★★☆☆☆ · Poor</option><option value="1">★☆☆☆☆ · Very poor</option></select><label>Written review (optional)</label><textarea name="review" maxlength="1000" placeholder="What did you think of this product?"></textarea><button class="btn" type="submit" style="margin-top:8px;background:#087e78;color:white">Submit review</button></form>';
 }).join("");
}
out.addEventListener("submit",async e=>{
 const form=e.target.closest("form.review-form");if(!form)return;e.preventDefault();
 const button=form.querySelector("button");button.disabled=true;
 const {error}=await db.from("product_reviews").insert({product_id:form.dataset.product,order_id:form.dataset.order,buyer_id:user.id,rating:Number(form.elements.rating.value),review_text:form.elements.review.value.trim()});
 if(error){alert("Could not submit review: "+error.message);button.disabled=false;return;}
 alert("Thank you! Your review has been submitted.");await start();
});
async function start(){if(!window.supabase||!window.BAZAARMV_SUPABASE?.url||!window.BAZAARMV_SUPABASE?.publishableKey){notice.textContent="BazaarMV database connection is not configured.";return;}db=window.supabase.createClient(window.BAZAARMV_SUPABASE.url,window.BAZAARMV_SUPABASE.publishableKey);const {data:{user:currentUser}}=await db.auth.getUser();user=currentUser;if(!user){notice.innerHTML='Please <a href="auth.html">sign in</a> to view your orders.';return;}const {data,error}=await db.from("orders").select("id,status,total_mvr,created_at,order_items(product_id,product_name,quantity,unit_price_mvr)").eq("buyer_id",user.id).order("created_at",{ascending:false});if(error){notice.textContent="Could not load orders: "+error.message;return;}await loadNotifications();subscribeToNotifications();const {data:enquiries,error:enquiryError}=await db.from("product_enquiries").select("id,message,created_at,seller_reply,replied_at,products(name)").eq("sender_id",user.id).order("created_at",{ascending:false});const enquiryBox=document.getElementById("enquiries");if(enquiryError){enquiryBox.innerHTML='<p class="muted">Could not load enquiries: '+esc(enquiryError.message)+'</p>';}else{enquiryBox.innerHTML=(enquiries||[]).map(q=>'<article class="order"><h2>'+esc(q.products?.name||"Product enquiry")+'</h2><p class="muted">'+new Date(q.created_at).toLocaleString()+'</p><p style="white-space:pre-wrap">'+esc(q.message)+'</p>'+(q.seller_reply?'<div class="notice"><b>Seller reply</b><p style="white-space:pre-wrap;margin:7px 0">'+esc(q.seller_reply)+'</p><span class="muted">'+new Date(q.replied_at).toLocaleString()+'</span></div>':'<p class="status">Waiting for seller reply</p>')+'</article>').join("")||'<p class="muted">You have not sent any enquiries yet.</p>';}notice.textContent=data.length?"Your order requests and seller-specific payment instructions are shown below.":"You have not sent any order requests yet.";
out.innerHTML=(await Promise.all(data.map(async o=>{
 const {data:rows,error:paymentError}=await db.rpc("bazaar_buyer_get_payment_instructions",{p_order_id:o.id});
 const p=rows?.[0]||null;let payHtml="";
 if(paymentError) payHtml='<p class="muted">Payment setup is not available yet. Please try again later.</p>';
 else if(!p) payHtml='<p class="muted">Seller payment details are not available.</p>';
 else {
  const status=p.payment_status||"not_submitted";
  payHtml='<div class="notice" style="margin-top:14px"><b>BML payment · '+esc(p.shop_name||p.seller_name)+'</b><p class="muted">Pay MVR '+Number(o.total_mvr).toFixed(2)+' directly to this seller.</p>'+(p.qr_url?'<img src="'+esc(p.qr_url)+'" alt="Seller BML QR code" style="display:block;max-width:220px;max-height:220px;object-fit:contain;margin:10px 0">':'')+'<p style="white-space:pre-wrap">'+esc(p.instructions||"The seller has not added payment instructions yet.")+'</p><p class="status">Payment status: '+esc(status.replaceAll("_"," "))+'</p>'+(p.admin_note?'<p class="muted">Seller note: '+esc(p.admin_note)+'</p>':'');
  if(status==="not_submitted"||status==="rejected") payHtml+='<form class="payment-form" data-order="'+esc(o.id)+'"><label>Transaction reference<input name="reference" required maxlength="120" style="display:block;width:100%;padding:10px;margin:6px 0 10px;border:1px solid #e8eeeb;border-radius:8px"></label><label>Payment proof (JPG, PNG, WEBP or PDF; max 5 MB)<input name="proof" type="file" required accept="image/jpeg,image/png,image/webp,application/pdf" style="display:block;margin:6px 0 10px"></label><button class="btn" type="submit" style="background:#087e78;color:white">Submit payment proof</button></form><small class="muted">Only submit proof after paying. It will be reviewed manually; a screenshot is not confirmation.</small>';
  payHtml+='</div>';
 }
 return '<article class="order"><div class="row"><div><h2>Order '+esc(o.id.slice(0,8))+'</h2><span class="muted">'+new Date(o.created_at).toLocaleString()+'</span></div><div class="status">'+esc(o.status)+'</div></div><div class="items">'+(o.order_items||[]).map(i=>'<div class="row"><span>'+esc(i.product_name)+' × '+i.quantity+'</span><span>MVR '+(Number(i.unit_price_mvr)*Number(i.quantity)).toFixed(2)+'</span></div>').join("")+'</div>'+(o.status==="Completed"?'<div class="review-box"><b>Rate your products</b><p class="muted">Share feedback on products from this completed order.</p>'+await renderOrderReviews(o)+'</div>':'')+'<div class="row" style="margin-top:12px"><b>Total</b><b>MVR '+Number(o.total_mvr).toFixed(2)+'</b></div>'+payHtml+'</article>';
}))).join("");
}
out.addEventListener("submit",async e=>{
 const form=e.target.closest("form.payment-form");if(!form)return;e.preventDefault();
 const file=form.elements.proof.files[0],reference=form.elements.reference.value.trim(),orderId=form.dataset.order;
 if(!file||file.size>5*1024*1024||!["image/jpeg","image/png","image/webp","application/pdf"].includes(file.type)){alert("Choose a JPG, PNG, WEBP or PDF file no larger than 5 MB.");return;}
 const button=form.querySelector("button");button.disabled=true;
 try{
  const ext=file.type==="application/pdf"?"pdf":file.type.split("/")[1];
  const path=user.id+"/"+orderId+"/"+crypto.randomUUID()+"."+ext;
  const {error:uploadError}=await db.storage.from("payment-proofs").upload(path,file,{upsert:false,contentType:file.type});if(uploadError)throw uploadError;
  const {error:submitError}=await db.rpc("bazaar_buyer_submit_payment_proof",{p_order_id:orderId,p_reference:reference,p_proof_path:path});if(submitError)throw submitError;
  alert("Proof submitted for review. Payment is not verified yet.");await start();
 }catch(err){alert("Could not submit proof: "+err.message);}finally{button.disabled=false;}
});
}
start();
</script></body></html>
